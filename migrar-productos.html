<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Migrar productos | SAEN IMPORT</title><link rel="stylesheet" href="admin.css"></head><body class="login-page"><main class="login-card"><div class="brand-mark">S</div><p class="eyebrow">MIGRACIÓN SEGURA</p><h1>Productos actuales</h1><p class="muted">Esta herramienta copia o actualiza por SKU; no borra los archivos locales ni registros remotos.</p><p><strong id="count">Calculando…</strong></p><button class="primary-btn" id="migrate">Migrar a Supabase</button><p id="result" class="form-message" role="status"></p><a class="back-link" href="admin.html">← Volver al panel</a></main>
<script src="datos-empresa.js"></script><script src="datos-accesorios.js"></script><script src="datos-cuidado.js"></script><script src="datos-higiene.js"></script><script src="datos-mochilas.js"></script><script src="datos-novedades.js"></script><script src="datos-cocina.js"></script><script src="datos-juguetes.js"></script><script src="datos-escolar.js"></script><script src="datos-maquillaje.js"></script><script src="datos-perfume.js"></script><script src="datos-papeleria.js"></script><script src="datos-loader.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase/migrate-products.js?v=2"></script><script>
const btn=document.getElementById('migrate'),result=document.getElementById('result');document.getElementById('count').textContent=`${SAEN_DATA.productos.length} productos detectados`;btn.onclick=async()=>{btn.disabled=true;result.textContent='Migrando…';try{const cfg=window.SAEN_SUPABASE||{};if(!cfg.url||!cfg.anonKey)throw new Error('Configura Supabase primero.');const client=window.supabase.createClient(cfg.url,cfg.anonKey),{data}=await client.auth.getSession();if(!data.session){location.href='admin-login.html';return}const rows=await migrateSaenProducts(SAEN_DATA.productos);result.style.color='#16845b';result.textContent=`Listo: ${rows.length} productos migrados.`}catch(e){result.textContent=e.message;btn.disabled=false}};
</script></body></html>
