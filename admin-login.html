<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Acceso administrador | SAEN IMPORT</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">S</div><p class="eyebrow">SAEN IMPORT</p>
    <h1>Panel administrador</h1><p class="muted">Ingresa con el usuario administrador creado en Supabase.</p>
    <form id="loginForm" class="stack">
      <label>Correo electrónico<input id="email" type="email" autocomplete="email" required placeholder="admin@saenimport.pe"></label>
      <label>Contraseña<input id="password" type="password" autocomplete="current-password" required minlength="6"></label>
      <p id="loginMessage" class="form-message" role="alert"></p>
      <button class="primary-btn" type="submit">Ingresar</button>
    </form>
    <a class="back-link" href="index.html">← Volver a la tienda</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script><script src="admin-login.js"></script>
</body></html>
